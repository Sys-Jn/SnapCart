{% extends 'base.html' %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Sign in to your SnapCart account</p>
    </div>
    <form method="POST" class="auth-form">
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary full">Sign In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80" alt="SnapCart store"/>
    <div class="auth-visual-text">
      <span class="brand" style="color:white;font-size:28px;">SnapCart</span>
      <p>Curated essentials for modern living</p>
    </div>
  </div>
</div>
{% endblock %}
